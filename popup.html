<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screenshot Cleaner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <img src="icons/icon48.png" alt="" class="brand-icon">
        <div>
          <h1>Screenshot Cleaner</h1>
          <p class="subtitle">For Zillow photo carousels</p>
        </div>
      </div>
    </header>

    <label class="toggle-row" for="enabled">
      <span class="label-text">
        <strong>Auto-clean</strong>
        <small>Removes overlays as you browse photos</small>
      </span>
      <span class="switch">
        <input type="checkbox" id="enabled">
        <span class="slider"></span>
      </span>
    </label>

    <div class="section-title">What to remove</div>
    <div class="options">
      <label class="check-row">
        <input type="checkbox" id="removeCounter">
        <span>Photo counter &mdash; <em>“15 of 26”</em></span>
      </label>
      <label class="check-row">
        <input type="checkbox" id="removeBadges">
        <span>Tour badges (virtual / 3D tour)</span>
      </label>
      <label class="check-row">
        <input type="checkbox" id="removeCaption">
        <span>Photo caption / description</span>
      </label>
      <label class="check-row">
        <input type="checkbox" id="removeLogo">
        <span>Logo watermark</span>
      </label>
    </div>

    <button id="cleanNow" class="btn-primary" type="button">
      Clean this page now
    </button>
    <div id="status" class="status" role="status" aria-live="polite"></div>

    <footer>
      <p>Open a Zillow listing, browse the photo carousel, and take your screenshots — overlays are stripped automatically.</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
